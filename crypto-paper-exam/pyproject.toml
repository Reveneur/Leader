[project]
name = "crypto-paper-exam"
version = "0.1.0"
description = "Exam V1 — realistic, reproducible crypto paper-trading engine with a fictional 100 EUR wallet."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "APScheduler>=3.10",
    "httpx>=0.27",
    "structlog>=24.1",
    "streamlit>=1.35",
    "pandas>=2.2",
    "gspread>=6.1",
    "google-auth>=2.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
